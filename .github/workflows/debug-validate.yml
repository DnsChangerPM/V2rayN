# TEMPORARY debug workflow — final verification of the "Validate version input"
# root cause and fix, using runner-invoked steps (same wrapper as release.yml).
name: Debug validate

on:
  push:
    branches:
      - arena/01a08cd2-v2rayn

permissions:
  contents: read

jobs:
  debug:
    name: Verify validate-step root cause + fix (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # The ORIGINAL step from release.yml @ 28f8bfc, verbatim (version input
      # substituted with 1.0.0, exactly like run 34519856009). Expected: fails
      # with "Process completed with exit code 1" and no error output — because
      # git ls-remote --exit-code returns 2 (tag missing = success case) and the
      # runner wrapper appends "exit $LASTEXITCODE" (pwsh -Command normalizes
      # non-0/1 exit codes to 1).
      - name: ORIGINAL step verbatim (expected to fail with exit 1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validate_version.py --version "1.0.0"
          $tag = "v1.0.0"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $tag already exists on origin. Refusing to overwrite an existing release."
            exit 1
          }
          "RELEASE_TAG_ORIG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_ORIG=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The FIXED step, exactly as it now exists in release.yml.
      - name: FIXED step verbatim (expected to pass)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validate_version.py --version "1.0.0"

          $tag = "v1.0.0"
          $ErrorActionPreference = 'Continue'
          $null = git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
          $lsExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'

          if ($lsExit -eq 0) {
            Write-Error "Tag $tag already exists on origin. Refusing to overwrite an existing release."
            exit 1
          }
          if ($lsExit -ne 2) {
            Write-Error "git ls-remote failed with exit code $lsExit while checking tag $tag on origin (network or credentials problem)."
            exit 1
          }

          "RELEASE_TAG_FIX=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_FIX=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
