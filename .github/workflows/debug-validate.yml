# TEMPORARY debug workflow — reproduces the "Validate version input" failure
# from run 34519856009 on a real windows-2022 runner. Findings are emitted as
# error annotations so they can be read back through the API.
name: Debug validate

on:
  push:
    branches:
      - arena/01a08cd2-v2rayn

permissions:
  contents: read

jobs:
  debug:
    name: Reproduce validate failure (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Repro A (original script, tag missing)
        shell: pwsh
        run: |
          @'
          $ErrorActionPreference = 'Stop'
          python scripts/validate_version.py --version "1.0.0"
          $tag = "v1.0.0"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $tag already exists on origin. Refusing to overwrite an existing release."
            exit 1
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          '@ | Set-Content -Path repro-a.ps1 -Encoding utf8

          $captured = & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoProfile -command ". './repro-a.ps1'" *>&1 | ForEach-Object { "$_" }
          "::error::REPRO-A-EXIT=$($LASTEXITCODE)"
          $i = 0
          foreach ($line in $captured) {
            if ($i -lt 8) { "::error::REPRO-A-OUT[$i]= $line"; $i++ }
          }

      - name: Repro B (original script, ref exists -> guard must fire)
        shell: pwsh
        run: |
          @'
          $ErrorActionPreference = 'Stop'
          python scripts/validate_version.py --version "1.0.0"
          $tag = "arena/01a08cd2-v2rayn"
          git ls-remote --exit-code origin "refs/heads/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $tag already exists on origin. Refusing to overwrite an existing release."
            exit 1
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          '@ | Set-Content -Path repro-b.ps1 -Encoding utf8

          $captured = & 'C:\Program Files\PowerShell\7\pwsh.exe' -NoProfile -command ". './repro-b.ps1'" *>&1 | ForEach-Object { "$_" }
          "::error::REPRO-B-EXIT=$($LASTEXITCODE)"
          $i = 0
          foreach ($line in $captured) {
            if ($i -lt 8) { "::error::REPRO-B-OUT[$i]= $line"; $i++ }
          }

      - name: Diagnose
        shell: pwsh
        run: |
          "::error::PSVER=$($PSVersionTable.PSVersion) GIT=$(git --version)"
          "::error::NCEAP=$PSNativeCommandUseErrorActionPreference"
          $ErrorActionPreference = 'Stop'
          try {
            git ls-remote --exit-code --tags origin "refs/tags/v1.0.0" 2>$null
            "::error::LSREM-STOP=no-throw exit=$LASTEXITCODE"
          } catch {
            $msg = ($_.Exception.Message -replace '\r?\n', ' / ')
            "::error::LSREM-STOP=THREW $($_.Exception.GetType().Name) $msg"
          }
          try {
            python -c "import sys; sys.stderr.write('STDERR-BOOM' + chr(10))" 2>$null
            "::error::REDIR-STDERR-STOP=no-throw exit=$LASTEXITCODE"
          } catch {
            $msg = ($_.Exception.Message -replace '\r?\n', ' / ')
            "::error::REDIR-STDERR-STOP=THREW $($_.Exception.GetType().Name) $msg"
          }

      - name: Test fixed logic (replacement for release.yml step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validate_version.py --version "1.0.0"
          $tag = "v1.0.0"
          $ErrorActionPreference = 'Continue'
          $null = git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
          $lsExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($lsExit -eq 0) { "::error::FIX-A=UNEXPECTED-EXISTS"; exit 1 }
          if ($lsExit -ne 2) { "::error::FIX-A=GIT-ERROR exit=$lsExit"; exit 1 }
          "RELEASE_TAG_FIX=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_FIX=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "::error::FIX-A=PASS lsExit=$lsExit"

          $tag2 = "arena/01a08cd2-v2rayn"
          $ErrorActionPreference = 'Continue'
          $null = git ls-remote --exit-code origin "refs/heads/$tag2" 2>$null
          $lsExit2 = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($lsExit2 -eq 0) {
            "::error::FIX-B=EXISTING-REF-DETECTED correctly (lsExit=0, guard would fire)"
          } else {
            "::error::FIX-B=WRONG lsExit=$lsExit2 (expected 0)"; exit 1
          }
