name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.19.6"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze (debug)
        run: |
          set +e
          flutter analyze --no-fatal-infos > ci-analyze.log 2>&1
          echo "ANALYZE_EXIT=$?" >> ci-analyze.log
          flutter test --reporter expanded > ci-test.log 2>&1
          echo "TEST_EXIT=$?" >> ci-test.log
          ls -la ci-analyze.log ci-test.log >> ci-analyze.log
          set -e

      - name: Publish debug logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### analyze"; tail -c 30000 ci-analyze.log; echo; echo "### test"; tail -c 20000 ci-test.log; } > ci-out.txt
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@ci-out.txt --jq .html_url

  build-windows:
    name: Build Windows (MSVC + Win32 plugin)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Diagnose + generate the Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'ci-runner.log'
          "=== execution policy ===" | Out-File -Append -Encoding utf8 $log
          Get-ExecutionPolicy -List | Out-File -Append -Encoding utf8 $log
          "=== script file ===" | Out-File -Append -Encoding utf8 $log
          "exists: $(Test-Path ./build/tools/New-WindowsRunner.ps1)" | Out-File -Append -Encoding utf8 $log
          "pwd: $(Get-Location)" | Out-File -Append -Encoding utf8 $log
          "=== flutter doctor ===" | Out-File -Append -Encoding utf8 $log
          (& flutter doctor 2>&1) | Out-File -Append -Encoding utf8 $log
          "=== inline flutter create ===" | Out-File -Append -Encoding utf8 $log
          (& flutter create --platforms=windows --project-name radin --org com.radin --no-pub . 2>&1) | Out-File -Append -Encoding utf8 $log
          "exit=$LASTEXITCODE" | Out-File -Append -Encoding utf8 $log
          "=== windows dir ===" | Out-File -Append -Encoding utf8 $log
          (Get-ChildItem -Recurse windows -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName }) | Out-File -Append -Encoding utf8 $log
          "=== try the script directly ===" | Out-File -Append -Encoding utf8 $log
          (& powershell -NoProfile -ExecutionPolicy Bypass -File ./build/tools/New-WindowsRunner.ps1 -Version 0.0.0-ci 2>&1) | Out-File -Append -Encoding utf8 $log
          "script_exit=$LASTEXITCODE" | Out-File -Append -Encoding utf8 $log

      - name: Build (debug)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release `
            --dart-define=APP_VERSION=0.0.0-ci `
            --dart-define=APP_BUILD=${{ github.run_number }} `
            --dart-define=GIT_SHA=${{ github.sha }} *>&1 |
            Tee-Object -FilePath ci-build.log
          "BUILD_EXIT=$LASTEXITCODE" | Out-File -Append -Encoding utf8 ci-build.log

      - name: Publish debug logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $runner = if (Test-Path ci-runner.log) { Get-Content ci-runner.log -Raw } else { '(missing)' }
          $build = if (Test-Path ci-build.log) { Get-Content ci-build.log -Raw } else { '(missing)' }
          $out = "### runner`n$runner`n`n### build`n$build"
          if ($out.Length -gt 60000) { $out = $out.Substring($out.Length - 60000) }
          Set-Content -Path ci-out.txt -Value $out -Encoding utf8
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -F body=@ci-out.txt --jq .html_url
