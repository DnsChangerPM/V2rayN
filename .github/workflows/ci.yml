name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.19.6"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze (debug)
        run: |
          set +e
          flutter analyze --no-fatal-infos > ci-analyze.log 2>&1
          echo "ANALYZE_EXIT=$?" >> ci-analyze.log
          flutter test --reporter expanded > ci-test.log 2>&1
          echo "TEST_EXIT=$?" >> ci-test.log
          set -e

      - name: Publish debug logs
        if: always()
        run: |
          mkdir -p ci-logs
          cp ci-analyze.log ci-test.log ci-logs/ 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: debug logs [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

  build-windows:
    name: Build Windows (MSVC + Win32 plugin)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Generate the Windows runner (debug)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./build/tools/New-WindowsRunner.ps1 -Version 0.0.0-ci *>&1 |
            Tee-Object -FilePath ci-runner.log
          "RUNNER_EXIT=$LASTEXITCODE" | Out-File -Append -Encoding utf8 ci-runner.log

      - name: Build (debug)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release `
            --dart-define=APP_VERSION=0.0.0-ci `
            --dart-define=APP_BUILD=${{ github.run_number }} `
            --dart-define=GIT_SHA=${{ github.sha }} *>&1 |
            Tee-Object -FilePath ci-build.log
          "BUILD_EXIT=$LASTEXITCODE" | Out-File -Append -Encoding utf8 ci-build.log

      - name: Publish debug logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          Copy-Item ci-runner.log, ci-build.log ci-logs -ErrorAction SilentlyContinue
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: debug logs (windows) [skip ci]" -ErrorAction SilentlyContinue
          git push origin HEAD:${{ github.ref_name }}
