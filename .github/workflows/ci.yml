# IranLink continuous integration: fast feedback on every push/PR.
# Heavy release-only steps (installer, signing-ish checks, publish) live in release.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          set +e
          flutter pub get 2>&1 | tee pub-get.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::flutter pub get failed with exit $code"
            grep -viE "^\s*$" pub-get.log | tail -30 | sed 's/^/::error::PUB: /'
            exit "$code"
          fi

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          grep -E " error • | warning • " analyze.log > analyze-ew.log || true
          grep -E " info • " analyze.log > analyze-info.log || true
          echo "ANALYZE_EXIT=$code" | tee -a "$GITHUB_ENV"
          echo "EW_COUNT=$(wc -l < analyze-ew.log)" | tee -a "$GITHUB_ENV"
          echo "INFO_COUNT=$(wc -l < analyze-info.log)" | tee -a "$GITHUB_ENV"
          tail -2 analyze.log
          exit "$code"

      - name: Report analyze errors/warnings
        if: failure()
        run: |
          echo "::error::EW_COUNT=${{ env.EW_COUNT }} INFO_COUNT=${{ env.INFO_COUNT }}"
          head -9 analyze-ew.log | sed 's/^/::error::ALZ! /'

      - name: Report analyze infos 1-9
        if: failure()
        run: |
          sed -n '1,9p' analyze-info.log | sed 's/^/::warning::ALZ1: /'

      - name: Report analyze infos 10-18
        if: failure()
        run: |
          sed -n '10,18p' analyze-info.log | sed 's/^/::warning::ALZ2: /'

      - name: Report analyze infos 19-27
        if: failure()
        run: |
          sed -n '19,27p' analyze-info.log | sed 's/^/::warning::ALZ3: /'

      - name: Report analyze infos 28-36
        if: failure()
        run: |
          sed -n '28,36p' analyze-info.log | sed 's/^/::warning::ALZ4: /'

      - name: Report analyze infos 37-45
        if: failure()
        run: |
          sed -n '37,45p' analyze-info.log | sed 's/^/::warning::ALZ5: /'

      - name: Report analyze infos 46-54
        if: failure()
        run: |
          sed -n '46,54p' analyze-info.log | sed 's/^/::warning::ALZ6: /'

      - name: Unit + widget tests
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::flutter test failed with exit $code"
            grep -viE "^\s*$" test.log | tail -40 | sed 's/^/::error::TST: /'
            exit "$code"
          fi

      - name: Validate helper scripts (compile + self-test)
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/validate_version.py --self-test
          python3 scripts/set_version.py --self-test
          python3 scripts/release_notes.py --self-test

      - name: Security audit
        run: python3 scripts/security_audit.py

      - name: Validate pinned toolchain file
        run: python3 scripts/check_toolchain.py

  build-windows:
    name: Build Windows (smoke, no publish)
    runs-on: windows-2022
    timeout-minutes: 60
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Load pinned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content tooling/versions.env | ForEach-Object {
            $line = $_.Trim()
            if ($line -eq '' -or $line.StartsWith('#')) { return }
            $kv = $line -split '=', 2
            "$($kv[0])=$($kv[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Download Xray core (pinned, digest-verified)
        shell: pwsh
        run: python scripts/download_xray.py --xray-version "$env:XRAY_VERSION" --out third_party/xray

      - name: Build Windows (release)
        shell: pwsh
        run: flutter build windows --release

      - name: Stage bundle
        shell: pwsh
        run: python scripts/stage_bundle.py --xray-dir third_party/xray --bundle build/windows/x64/runner/Release

      - name: Compatibility check
        shell: pwsh
        run: python scripts/compat_check.py --version 0.0.0-ci --bundle build/windows/x64/runner/Release

      - name: Integration test (real core lifecycle, debug build)
        shell: pwsh
        env:
          IRANLINK_CORE_DIR: ${{ github.workspace }}\build\windows\x64\runner\Release\core
        run: flutter test -d windows integration_test --reporter expanded

      - name: Smoke test (headless launch + real core start)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD\build\windows\x64\runner\Release\IranLink.exe" --smoke-test --smoke-timeout 120
          if ($LASTEXITCODE -ne 0) { Write-Error 'Smoke test failed.'; exit 1 }

      - name: Benchmark (startup wall time + peak RSS)
        shell: pwsh
        run: python scripts/bench_startup.py --exe "$PWD\build\windows\x64\runner\Release\IranLink.exe" --label "ci-${{ github.run_id }}" --out dist/bench.jsonl

      - name: Upload benchmark log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ github.run_id }}
          path: dist/bench.jsonl
          retention-days: 90
